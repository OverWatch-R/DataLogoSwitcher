name: Build DataLogoSwitcher

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos

      - name: Build rootless (iOS 17 compatible)
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: DataLogoSwitcher-rootless
          path: packages/*.deb
          if-no-files-found: error
