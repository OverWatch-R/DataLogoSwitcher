TWEAK_NAME = DataLogoSwitcher
DataLogoSwitcher_FILES = Tweak.x
DataLogoSwitcher_CFLAGS = -fobjc-arc
DataLogoSwitcher_FRAMEWORKS = Foundation UIKit
FINALPACKAGE = 1

# iOS 17.0–17.3.1 → arm64 + arm64e only
# Deployment target 15.0 is the minimum required for rootless and works perfectly on 17.x
ifeq ($(THEOS_PACKAGE_SCHEME),rootless)
	ARCHS = arm64 arm64e
	TARGET = iphone:clang:latest:15.0
else
	ARCHS = arm64 arm64e
	TARGET = iphone:clang:latest:15.0
endif

SUBPROJECTS += DataLogoSwitcherSettings

include $(THEOS)/makefiles/common.mk
include $(THEOS_MAKE_PATH)/tweak.mk
include $(THEOS_MAKE_PATH)/bundle.mk
include $(THEOS_MAKE_PATH)/aggregate.mk

# Optional: quick install helper (works for both rootless & rootful)
sync: stage
ifeq ($(THEOS_PACKAGE_SCHEME),rootless)
	rsync -e "ssh -p 2222" -z .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/* root@127.0.0.1:/var/jb/Library/MobileSubstrate/DynamicLibraries/
	rsync -e "ssh -p 2222" -avz .theos/_/var/jb/Library/PreferenceBundles/DataLogoSwitcher.bundle/* root@127.0.0.1:/var/jb/Library/PreferenceBundles/DataLogoSwitcher.bundle/
else
	rsync -e "ssh -p 2222" -z .theos/_/Library/MobileSubstrate/DynamicLibraries/* root@127.0.0.1:/Library/MobileSubstrate/DynamicLibraries/
	rsync -e "ssh -p 2222" -avz .theos/_/Library/PreferenceBundles/DataLogoSwitcher.bundle/* root@127.0.0.1:/Library/PreferenceBundles/DataLogoSwitcher.bundle/
endif
	ssh root@127.0.0.1 -p 2222 killall -9 backboardd
